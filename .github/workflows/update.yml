name: Update & Deploy Dashboard

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 min, every day
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'  # don't re-trigger on the pipeline's own automated data commits
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize against any run that commits data/ (including slack-summaries)
# so overlapping runs don't race. Let an in-progress run finish, don't cancel.
concurrency:
  group: shop-dashboard-data-commit
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run data pipeline
        env:
          HARVEST_ACCOUNT_ID: ${{ secrets.HARVEST_ACCOUNT_ID }}
          HARVEST_TOKEN: ${{ secrets.HARVEST_TOKEN }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          PTO_CALENDAR_URL: ${{ secrets.PTO_CALENDAR_URL }}
          SHOP_CALENDAR_URL: ${{ secrets.SHOP_CALENDAR_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/generate_data.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update dashboard data [automated]"
            # Rebase onto any commits pushed since checkout. The pipeline
            # regenerates data/ deterministically, so on conflict our freshly
            # generated version wins (-X theirs = the commit being replayed).
            # Retry to absorb a push race with another run.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then
                echo "Pushed data update"
                break
              fi
              echo "Push failed (attempt $attempt); aborting rebase and retrying..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
              if [ "$attempt" = "5" ]; then
                echo "::error::Could not push data update after 5 attempts"
                exit 1
              fi
            done
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 300000  # fail after 5 min instead of blocking the queue for 10

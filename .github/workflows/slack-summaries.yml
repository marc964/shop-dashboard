name: Post Vehicle Summaries to Slack

on:
  # schedule:
  #   - cron: '0 23 * * 1-5'  # 6PM CT (UTC-5) weekdays
  workflow_dispatch:         # manual trigger only for now

jobs:
  post-summaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Refresh checkout data
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          python -c "
          import json, sys
          sys.path.insert(0, 'pipeline')
          from fetch_checkout import fetch_checkout_data
          data = fetch_checkout_data()
          with open('data/checkout.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Start local server
        run: python -m http.server 8000 &

      - name: Screenshot and post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BASE_URL: "http://localhost:8000"
        run: node scripts/screenshot.js

      - name: Save snapshot hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot-hashes.json
          if git diff --cached --quiet; then
            echo "No hash changes"
          else
            git commit -m "Update snapshot hashes [automated]"
            git push
          fi

name: Track Vehicle Summary Changes

on:
  schedule:
    - cron: '0 23 * * 1-5'  # 6PM CT (UTC-5) weekdays
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

# Share a concurrency group with update.yml so the two never race on data/.
concurrency:
  group: shop-dashboard-data-commit
  cancel-in-progress: false

jobs:
  track-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Refresh checkout data
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          python -c "
          import json, sys
          sys.path.insert(0, 'pipeline')
          from fetch_checkout import fetch_checkout_data
          data = fetch_checkout_data()
          with open('data/checkout.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Send daily diff to Alex
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node scripts/daily-diff.js

      - name: Update snapshot hashes
        run: node scripts/seed-hashes.js

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update snapshot data [automated]"
            # Rebase onto commits pushed since checkout; on conflict keep our
            # freshly generated data (-X theirs = the commit being replayed).
            # Retry to absorb a push race with another run.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then
                echo "Pushed snapshot update"
                break
              fi
              echo "Push failed (attempt $attempt); aborting rebase and retrying..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
              if [ "$attempt" = "5" ]; then
                echo "::error::Could not push snapshot update after 5 attempts"
                exit 1
              fi
            done
          fi

